<dialog #dialog class="dialog" aria-labelledby="category-dialog-title" (close)="onDialogClosed()" (click)="onDialogClick($event)">
  @if (category(); as category) {
    <div class="dialog__panel">
      <button class="dialog__close" type="button" aria-label="Fechar" (click)="close()">
        <app-icon name="close" />
      </button>

      <span class="dialog__icon"><app-icon [name]="category.icon" /></span>
      <h3 id="category-dialog-title" class="dialog__title">{{ category.name }}</h3>
      <p>{{ category.summary }}</p>

      <h4 class="dialog__subtitle">Exemplos</h4>
      <ul class="dialog__examples">
        @for (example of category.examples; track example) {
          <li>
            <app-icon name="check" />
            {{ example }}
          </li>
        }
      </ul>

      <a class="btn btn--whatsapp dialog__cta" [href]="whatsappUrlFor(category)" target="_blank" rel="noopener noreferrer">
        <app-icon name="whatsapp" />
        Pedir orçamento no WhatsApp
      </a>
      <p class="dialog__note">Exemplos ilustrativos. Preço e disponibilidade são informados no atendimento.</p>
    </div>
  }
</dialog>
