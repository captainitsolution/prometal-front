name: CI/CD

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_OUTPUT_DIR: dist/prometal/browser

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Testes unitários
        run: npm run test:ci

      - name: Build de produção
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ env.BUILD_OUTPUT_DIR }}
          retention-days: 7

  deploy:
    name: Publicar no Cloudflare Pages
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ env.BUILD_OUTPUT_DIR }}

      - name: Verificar configuração do Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_PAGES_PROJECT; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta configurar $name em Settings > Secrets and variables > Actions"
              missing=1
            fi
          done
          exit $missing

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ${{ env.BUILD_OUTPUT_DIR }} --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=master
